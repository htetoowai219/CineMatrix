services:
  # --------------------------------------------------
  # 1. Local MongoDB Database
  # --------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: cinematrix_mongodb
    # No host port: the backend reaches it as mongodb:27017 on the Compose
    # network. Publishing 27017 also collides with a locally installed mongod.
    volumes:
      - mongo_data:/data/db
    networks:
      - cinematrix_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # --------------------------------------------------
  # 2. Redis (seat locks + booking timeouts)
  # --------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cinematrix_redis
    # Internal-only: a local Redis commonly owns host port 6379. Add
    # "6380:6379" under ports if you need host access for debugging.
    networks:
      - cinematrix_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------
  # 3. NestJS Backend
  # --------------------------------------------------
  nest-backend:
    build:
      context: ./nest-backend
      dockerfile: Dockerfile
    container_name: cinematrix_nest_backend
    ports:
      - "8000:8000"
    # Copy nest-backend/.env.example to nest-backend/.env to supply secrets
    # (JWT, Cloudinary, SMTP, TMDB). The file is optional so Compose can boot
    # without it for local development.
    env_file:
      - path: ./nest-backend/.env
        required: false
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/cinematrix
      - FRONTEND_CLIENT=http://localhost:5173
      - FRONTEND_ADMIN=http://localhost:5174
      - ACCESS_TOKEN_EXP=1d
      - REFRESH_TOKEN_EXP=7d
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./nest-backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinematrix_network

  # --------------------------------------------------
  # 4. Frontend Client
  # --------------------------------------------------
  frontend-client:
    build:
      context: ./frontend-client
      dockerfile: Dockerfile
    container_name: cinematrix_client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend-client:/app
      - /app/node_modules
    depends_on:
      - nest-backend
    networks:
      - cinematrix_network

  # --------------------------------------------------
  # 5. Frontend Admin
  # --------------------------------------------------
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: cinematrix_admin
    ports:
      - "5174:5173" # Maps host port 5174 to container port 5173
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - nest-backend
    networks:
      - cinematrix_network

# Named volumes for persistent MongoDB storage
volumes:
  mongo_data:

# Internal network for container communication
networks:
  cinematrix_network:
    driver: bridge
